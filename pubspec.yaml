name: doktanet
description: DoktaNet - plateforme de téléconsultation et parcours de soins connectés (Togo).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  url_launcher: ^6.2.0
  web: ^1.0.0
  image_picker: ^1.0.7
  intl: ">=0.19.0 <1.0.0"
  flutter_markdown: ^0.7.4
  file_picker: ^8.1.2
  pdf: ^3.11.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  fetch_client: ^1.1.2
  markdown: ^7.2.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/photos/
