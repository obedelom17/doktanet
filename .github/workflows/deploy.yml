name: deploy
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run check:api
      - run: npm test
  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true
      - run: flutter build web --release
      - name: Poids du bundle (exigence 3G)
        run: |
          du -sh build/web
          ls -l build/web/main.dart.js | awk '{printf "main.dart.js : %.0f Ko\n", $5/1024}'
          gzip -9 -c build/web/main.dart.js | wc -c | awk '{printf "main.dart.js gzip : %.0f Ko\n", $1/1024}'
      - run: npm install
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=doktanet
