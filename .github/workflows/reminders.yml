name: Rappels de rendez-vous
# Envoie les rappels (notification + email) des rendez-vous des prochaines 24 h.
# Inactif tant que les secrets GitHub APP_URL et CRON_SECRET ne sont pas créés : il se termine alors en vert, sans rien faire.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  rappels:
    name: Rappels
    runs-on: ubuntu-latest
    steps:
      - name: Appeler l'API
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Secrets APP_URL / CRON_SECRET absents : rappels désactivés."
            exit 0
          fi
          curl -fsS -X POST "$APP_URL/api/cron/reminders" -H "x-cron-secret: $CRON_SECRET"
